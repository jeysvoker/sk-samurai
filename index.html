<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SK SAMURAI</title>
    <meta name="description" content="SK-FX PREDATORS — трейдинг це професія" />
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body data-page="home">
    <header class="hero" id="top">
      <div class="hero__top">
        <div class="language-switcher" aria-label="Language selector">
          <div class="language-switcher__dropdown" data-lang-dropdown>
            <button class="language-switcher__trigger" type="button" aria-haspopup="true" aria-expanded="false" data-lang-trigger>
              <span class="language-switcher__current">
                <span class="language-switcher__flag" data-lang-current-flag>🇷🇺</span>
                <span class="language-switcher__current-code" data-lang-current-code>RU</span>
              </span>
              <span class="language-switcher__chevron" aria-hidden="true">▾</span>
            </button>

            <div class="language-switcher__menu" data-lang-menu hidden>
              <button class="language-option" type="button" data-lang-btn="uk">
                <span class="language-option__flag" aria-hidden="true">🇺🇦</span>
                <span class="language-option__code">UA</span>
                <span class="language-option__name">Українська</span>
              </button>

              <button class="language-option" type="button" data-lang-btn="ru">
                <span class="language-option__flag" aria-hidden="true">🇷🇺</span>
                <span class="language-option__code">RU</span>
                <span class="language-option__name">Русский</span>
              </button>

              <button class="language-option" type="button" data-lang-btn="en">
                <span class="language-option__flag" aria-hidden="true">🇬🇧</span>
                <span class="language-option__code">EN</span>
                <span class="language-option__name">English</span>
              </button>
            </div>
          </div>
        </div>

        <img class="hero__logo" src="assets/logo.jpg" alt="SK-FX logo" />
        <h1 class="hero__title">
          SK SAMURAI
          <svg class="hero__verified" viewBox="0 0 40 40" aria-label="Verified" role="img">
            <g fill="#0A84FF">
              <rect x="4" y="4" width="32" height="32" rx="9"/>
              <rect x="4" y="4" width="32" height="32" rx="9" transform="rotate(45 20 20)"/>
            </g>
            <path d="M13 20.5l5 5 9-10" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </h1>
        <p class="hero__subtitle" data-i18n="home.heroSubtitle"><span style="font-weight:800">ТРЕЙДИНГ — ЦЕ ПРОФЕСІЯ</span></p>

        <nav class="hero__links hero__links--social" data-i18n-aria="common.socialAria" aria-label="Social links">
          <a class="social-link" href="https://www.instagram.com/jeys_voker?igsh=MWp3Y2gwNGY2YXdjdg%3D%3D&utm_source=qr" target="_blank" rel="noopener">
            <img src="assets/icons/instagram.svg" alt="Instagram" />
            <span data-i18n="common.instagram">Instagram</span>
          </a>

          <a class="social-link" href="https://t.me/+vmnQzVOUlys3ZmFi" target="_blank" rel="noopener">
            <img src="assets/icons/telegram.svg" alt="Telegram" />
            <span data-i18n="common.telegram">Telegram</span>
          </a>
        </nav>
      </div>

      <section class="card card--disclaimer" aria-label="Disclaimer">
        <div class="card__body">
          <div class="card__kicker" data-i18n="home.disclaimerKicker">ДИСКЛЕЙМЕР</div>
          <p class="card__text" data-i18n="home.disclaimerText">
            я не зацікавлений когось із вас вмовляти чи просити, мене цікавлять люди, які розуміють, що я даю можливість, я сам заробляю гроші й радий, коли люди заробляють їх разом зі мною
          </p>
        </div>
      </section>
    </header>

    <main class="page">
      <footer class="footer">
        <small>© <span id="year"></span> SK SAMURAI</small>
      </footer>
    </main>

    <nav class="bottom-nav" data-i18n-aria="nav.navAria" aria-label="Нижня навігація">
      <a class="bottom-nav__item is-active" href="index.html#home" data-i18n-aria="nav.homeAria" aria-label="Головна">
        <svg class="bottom-nav__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3.5 10.5 12 4l8.5 6.5" />
          <path d="M5.5 9.5V19a1 1 0 0 0 1 1H10v-5a2 2 0 0 1 2-2h0a2 2 0 0 1 2 2v5h3.5a1 1 0 0 0 1-1V9.5" />
        </svg>
        <span class="bottom-nav__label" data-i18n="nav.home">Головна</span>
      </a>

      <a class="bottom-nav__item" href="details-chat.html" data-i18n-aria="nav.chatAria" aria-label="Закритий чат">
        <svg class="bottom-nav__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 4.5h16a1 1 0 0 1 1 1V15a1 1 0 0 1-1 1H9.5L5 19.5V16H4a1 1 0 0 1-1-1V5.5a1 1 0 0 1 1-1z" />
        </svg>
        <span class="bottom-nav__label" data-i18n="nav.chat">Закритий чат</span>
      </a>

      <a class="bottom-nav__item" href="details-training.html" data-i18n-aria="nav.trainingAria" aria-label="Навчання">
        <svg class="bottom-nav__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 4 2 9l10 5 10-5-10-5z" />
          <path d="M6 11.5V16c0 1.5 2.7 3 6 3s6-1.5 6-3v-4.5" />
          <path d="M22 9v6" />
        </svg>
        <span class="bottom-nav__label" data-i18n="nav.training">Навчання</span>
      </a>

      <a class="bottom-nav__item" href="https://t.me/manager_sk_ua" target="_blank" rel="noopener" data-i18n-aria="nav.supportAria" aria-label="Підтримка">
        <svg class="bottom-nav__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 13v-1a8 8 0 0 1 16 0v1" />
          <path d="M4 13h1.5A1.5 1.5 0 0 1 7 14.5V17a1.5 1.5 0 0 1-1.5 1.5H4a1 1 0 0 1-1-1v-3.5A1 1 0 0 1 4 13z" />
          <path d="M20 13h-1.5A1.5 1.5 0 0 0 17 14.5V17a1.5 1.5 0 0 0 1.5 1.5H20a1 1 0 0 0 1-1v-3.5a1 1 0 0 0-1-1z" />
          <path d="M18.5 18.5v.5a2.5 2.5 0 0 1-2.5 2.5h-2" />
        </svg>
        <span class="bottom-nav__label" data-i18n="nav.support">Підтримка</span>
      </a>
    </nav>

    <script src="script.js"></script>
  </body>
</html>
